[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-rlm"
version = "0.1.0"
description = "Recursive LLM inference with parallel execution and curriculum-aware scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
efficient-rlm = "efficient_rlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
