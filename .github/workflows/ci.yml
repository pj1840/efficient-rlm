name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile checks
        run: python -m compileall -q src tests

      - name: CLI smoke test
        run: python -m efficient_rlm --help

      - name: Trace HTML renderer smoke test
        run: python scripts/render_trace_html.py results/traces/ollama_recursive_demo.json --output /tmp/efficient_rlm_trace.html
